# Fork-only CI: builds the OmniRoute Docker image (runner-base) and publishes
# it to this fork's GitHub Container Registry.
#
# This workflow is intentionally isolated from the upstream release pipeline:
# it never touches Docker Hub, npm, GitHub Releases, or the official
# docker-publish.yml workflow. It only runs on this fork and only for the
# feature branch below (or a manual workflow_dispatch). Keep the guard on the
# publish job: a copy of this file landing upstream must never publish here.
name: Build Fork Docker Image

on:
  push:
    branches:
      - feat/kilo-quota-support
  workflow_dispatch:

# Two pushed commits on this branch cancel each other: only the newest SHA
# becomes the kilo-quota tag. No other workflow uses this group.
concurrency:
  group: build-fork-image-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the checkout, write the package. No other scope.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish fork image (linux/amd64)
    runs-on: ubuntu-latest
    # The publish job only ever runs in this fork. If this workflow file is
    # copied to another repository (e.g. opened as an upstream PR), the
    # condition turns false and nothing is published anywhere.
    if: github.repository == 'killer30001000/OmniRoute'
    env:
      IMAGE_NAME: ghcr.io/killer30001000/omniroute
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=kilo-quota
            type=raw,value=feat-kilo-quota-support
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache for Buildx: subsequent builds of this branch
          # reuse layers (npm ci + next build are the slow parts).
          cache-from: type=gha
          cache-to: type=gha,mode=max
