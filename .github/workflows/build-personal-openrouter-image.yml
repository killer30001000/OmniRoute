name: Build Personal OpenRouter Image

on:
  push:
    branches:
      - personal/openrouter-usage-next
  workflow_dispatch:

concurrency:
  group: personal-openrouter-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.repository == 'killer30001000/OmniRoute'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          IMAGE_NAME: ghcr.io/killer30001000/omniroute
        run: |
          echo "mutable=${IMAGE_NAME}:openrouter" >> "$GITHUB_OUTPUT"
          echo "immutable=${IMAGE_NAME}:openrouter-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.mutable }}
            ${{ steps.image.outputs.immutable }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Match the official hosted build's webpack fallback for Turbopack OOM resilience.
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          cache-from: type=gha,scope=personal-openrouter-usage-amd64
          cache-to: type=gha,scope=personal-openrouter-usage-amd64,mode=max,ignore-error=true
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1
